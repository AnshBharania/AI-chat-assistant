<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>AI Chat Assistant</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; background: #f7f7f8; }
  h1 { font-size: 1.4rem; }
  #chat { border: 1px solid #ddd; border-radius: 8px; height: 420px; overflow-y: auto; padding: 12px; background: white; margin-bottom: 12px; }
  .msg { margin: 8px 0; padding: 8px 12px; border-radius: 8px; max-width: 80%; }
  .user { background: #dbeafe; margin-left: auto; text-align: right; }
  .assistant { background: #f1f1f1; }
  form { display: flex; gap: 8px; }
  input { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #ccc; }
  button { padding: 10px 16px; border: none; border-radius: 6px; background: #2563eb; color: white; cursor: pointer; }
  button:disabled { opacity: 0.6; cursor: default; }
</style>
</head>
<body>
  <h1>AI Chat Assistant</h1>
  <div id="chat"></div>
  <form id="form">
    <input id="input" placeholder="Ask me anything..." autocomplete="off" required />
    <button id="send" type="submit">Send</button>
  </form>

  <script>
    const chatEl = document.getElementById("chat");
    const formEl = document.getElementById("form");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const history = [];

    function addMessage(role, text) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      div.textContent = text;
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    formEl.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = inputEl.value.trim();
      if (!text) return;

      addMessage("user", text);
      history.push({ role: "user", content: text });
      inputEl.value = "";
      sendBtn.disabled = true;

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: history }),
        });
        const data = await res.json();
        if (data.reply) {
          addMessage("assistant", data.reply);
          history.push({ role: "assistant", content: data.reply });
        } else {
          addMessage("assistant", "Error: " + (data.error || "Unknown error"));
        }
      } catch (err) {
        addMessage("assistant", "Network error. Please try again.");
      } finally {
        sendBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
